<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333EA"/>
    </marker>

    <!-- AWS Orange Gradient -->
    <linearGradient id="aws-badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Container -->
  <rect x="20" y="20" width="1060" height="680" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#drop-shadow)"/>

  <!-- Header Section -->
  <g transform="translate(45, 42)">
    <text x="0" y="20" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.5px">Diabetes Prediction MLOps Architecture</text>
    <text x="0" y="40" font-size="13" font-weight="500" fill="#64748B">End-to-end Machine Learning Pipeline &amp; Amazon EKS Deployment</text>
    
    <!-- Author Metadata -->
    <g transform="translate(990, 0)">
      <text x="0" y="16" text-anchor="end" font-size="12" font-weight="700" fill="#1E293B" letter-spacing="0.5px">SITHUM WICKRAMANAYAKA</text>
      <text x="0" y="34" text-anchor="end" font-size="11" font-weight="500" fill="#64748B">Implemented system · October 2026</text>
    </g>
  </g>

  <line x1="45" y1="95" x2="1055" y2="95" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- LEFT COLUMN COMPONENTS -->

  <!-- Developer Card -->
  <g transform="translate(45, 115)">
    <rect width="175" height="115" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#drop-shadow)"/>
    <g transform="translate(14, 14)">
      <circle cx="12" cy="8" r="6" fill="none" stroke="#2563EB" stroke-width="2"/>
      <path d="M 2 24 C 2 17, 7 15, 12 15 C 17 15, 22 17, 22 24" fill="none" stroke="#2563EB" stroke-width="2"/>
    </g>
    <text x="46" y="30" font-size="13" font-weight="700" fill="#0F172A">Developer / ML</text>
    <text x="14" y="58" font-size="11" font-weight="500" fill="#475569">Source Code &amp; Model</text>
    <text x="14" y="76" font-size="11" font-weight="500" fill="#475569">Scikit-Learn Random Forest</text>
    <text x="14" y="96" font-size="10" font-weight="600" fill="#2563EB">train.py &amp; main.py</text>
  </g>

  <!-- GitHub Card -->
  <g transform="translate(45, 265)">
    <rect width="175" height="115" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#drop-shadow)"/>
    <g transform="translate(14, 14)">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" fill="#181717"/>
    </g>
    <text x="46" y="30" font-size="13" font-weight="700" fill="#0F172A">GitHub Repo</text>
    <text x="14" y="58" font-size="11" font-weight="500" fill="#475569">Version Control System</text>
    <text x="14" y="76" font-size="11" font-weight="600" fill="#0F172A">suwickramanayaka/</text>
    <text x="14" y="94" font-size="10" font-weight="500" fill="#64748B">diabetes-prediction-mlops</text>
  </g>

  <!-- Client / Visitor Card -->
  <g transform="translate(45, 455)">
    <rect width="175" height="115" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#drop-shadow)"/>
    <g transform="translate(14, 14)">
      <rect x="2" y="4" width="20" height="14" rx="2" fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M 8 21 L 16 21 M 12 18 L 12 21" stroke="#059669" stroke-width="2"/>
    </g>
    <text x="46" y="30" font-size="13" font-weight="700" fill="#0F172A">Client / Visitor</text>
    <text x="14" y="58" font-size="11" font-weight="500" fill="#475569">Web Browser / Mobile</text>
    <text x="14" y="76" font-size="11" font-weight="600" fill="#059669">HTTP Public Traffic</text>
    <text x="14" y="94" font-size="10" font-weight="500" fill="#64748B">POST /predict &amp; GET /docs</text>
  </g>

  <!-- MAIN AWS CLOUD CONTAINER -->
  <g transform="translate(250, 115)">
    <!-- Outer Cloud Box -->
    <rect width="805" height="455" rx="14" fill="#FFFBF5" stroke="#F97316" stroke-width="2" filter="url(#drop-shadow)"/>
    
    <!-- AWS Badge Header -->
    <g transform="translate(16, 12)">
      <rect width="28" height="28" rx="6" fill="url(#aws-badge-grad)"/>
      <path d="M7 14 L12 20 L21 9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="36" y="18" font-size="14" font-weight="700" fill="#C2410C" letter-spacing="-0.2px">AWS Cloud / ap-south-1 · Mumbai</text>
      <text x="36" y="32" font-size="11" font-weight="500" fill="#9A3412">Amazon EKS v1.36 · Amazon ECR · AWS Network Load Balancer</text>
    </g>

    <!-- INNER ITEM 1: AMAZON ECR BOX -->
    <g transform="translate(20, 55)">
      <rect width="220" height="185" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#drop-shadow)"/>
      <rect x="14" y="12" width="26" height="26" rx="6" fill="#EFF6FF"/>
      <path d="M 20 20 L 34 20 M 20 25 L 34 25 M 20 30 L 34 30" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="28" font-size="13" font-weight="700" fill="#0F172A">Amazon ECR</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#2563EB">Private Container Registry</text>
      <text x="14" y="74" font-size="10" font-weight="500" fill="#475569">Repository: <tspan font-weight="700">diabetes-api</tspan></text>
      <text x="14" y="92" font-size="10" font-weight="500" fill="#475569">Tag: <tspan font-weight="700">v1 (IMMUTABLE)</tspan></text>
      <rect x="14" y="104" width="192" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="20" y="120" font-size="9" font-family="monospace" fill="#334155">sha256:5e88ae2f0a3d6a70...</text>
      <text x="20" y="136" font-size="9" font-family="monospace" fill="#334155">&lt;ACCOUNT_ID&gt;.dkr.ecr...</text>
      <text x="14" y="168" font-size="10" font-weight="500" fill="#059669">AES-256 Encrypted Storage</text>
    </g>

    <!-- INNER ITEM 2: EBS STORAGE BOX -->
    <g transform="translate(20, 255)">
      <rect width="220" height="185" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#drop-shadow)"/>
      <rect x="14" y="12" width="26" height="26" rx="6" fill="#ECFDF5"/>
      <rect x="19" y="17" width="16" height="16" rx="2" fill="none" stroke="#059669" stroke-width="2"/>
      <circle cx="27" cy="25" r="2" fill="#059669"/>
      <text x="48" y="28" font-size="13" font-weight="700" fill="#0F172A">Amazon EBS Storage</text>
      <text x="14" y="52" font-size="11" font-weight="600" fill="#059669">EBS Volume (gp3)</text>
      <text x="14" y="76" font-size="11" font-weight="500" fill="#334155">• Disk Size: <tspan font-weight="700">20 GiB</tspan></text>
      <text x="14" y="96" font-size="11" font-weight="500" fill="#334155">• Storage Type: <tspan font-weight="700">gp3 SSD</tspan></text>
      <text x="14" y="116" font-size="11" font-weight="500" fill="#334155">• Encryption: <tspan font-weight="700">KMS Enabled</tspan></text>
      <text x="14" y="136" font-size="11" font-weight="500" fill="#334155">• DeleteOnTermination: <tspan font-weight="700">true</tspan></text>
      <text x="14" y="162" font-size="10" font-weight="500" fill="#64748B">Root Device /dev/xvda</text>
    </g>

    <!-- INNER ITEM 3: EKS CLUSTER BOX -->
    <g transform="translate(255, 55)">
      <rect width="530" height="385" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
      
      <!-- EKS Cluster Header -->
      <g transform="translate(16, 12)">
        <text x="0" y="16" font-size="13" font-weight="700" fill="#0369A1" letter-spacing="-0.2px">AMAZON EKS CLUSTER: diabetes-mlops (v1.36 STANDARD)</text>
        <text x="0" y="30" font-size="10" font-weight="500" fill="#0284C7">Namespace: mlops · Endpoint: Public/Private · IAM Role: diabetes-eks-cluster-role</text>
      </g>

      <!-- NLB BOX -->
      <g transform="translate(16, 42)">
        <rect width="498" height="65" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#drop-shadow)"/>
        <rect x="12" y="10" width="24" height="24" rx="4" fill="#CCFBF1"/>
        <path d="M16 22 L24 14 L32 22" fill="none" stroke="#0D9488" stroke-width="2"/>
        <text x="44" y="26" font-size="13" font-weight="700" fill="#0F172A">AWS Network Load Balancer (NLB)</text>
        <text x="44" y="42" font-size="11" font-weight="600" fill="#0D9488">Service: diabetes-api-public · Type: LoadBalancer (internet-facing)</text>
        <text x="44" y="56" font-size="10" font-weight="500" fill="#475569">Public Port :80 -&gt; NodePort :30997 -&gt; Target Container :8000</text>
      </g>

      <!-- WORKER NODE BOX -->
      <g transform="translate(16, 118)">
        <rect width="498" height="252" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#drop-shadow)"/>
        
        <!-- Node Header -->
        <g transform="translate(12, 10)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Managed Worker Node (diabetes-workers)</text>
          <text x="0" y="28" font-size="10" font-weight="500" fill="#64748B">Instance: t3.small (2 vCPU / 2 GiB RAM) · OS: Amazon Linux 2023 (AL2023_x86_64)</text>
        </g>

        <!-- ClusterIP Service Sub-Box -->
        <g transform="translate(12, 40)">
          <rect width="225" height="195" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
          <text x="12" y="22" font-size="11" font-weight="700" fill="#065F46">ClusterIP Service</text>
          <text x="12" y="38" font-size="10" font-weight="600" fill="#047857">diabetes-api-service</text>
          <text x="12" y="62" font-size="10" font-weight="500" fill="#334155">• Service Type: <tspan font-weight="700">ClusterIP</tspan></text>
          <text x="12" y="80" font-size="10" font-weight="500" fill="#334155">• Internal Port: <tspan font-weight="700">80</tspan></text>
          <text x="12" y="98" font-size="10" font-weight="500" fill="#334155">• Target Port: <tspan font-weight="700">8000</tspan></text>
          <text x="12" y="116" font-size="10" font-weight="500" fill="#334155">• Selector: <tspan font-weight="700">app=diabetes-api</tspan></text>
          <text x="12" y="134" font-size="10" font-weight="500" fill="#334155">• Namespace: <tspan font-weight="700">mlops</tspan></text>
          <text x="12" y="170" font-size="9" font-weight="600" fill="#059669">Stable Cluster-Internal IP</text>
        </g>

        <!-- FastAPI Pod Sub-Box -->
        <g transform="translate(255, 40)">
          <rect width="230" height="195" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
          <text x="12" y="22" font-size="11" font-weight="700" fill="#1E40AF">FastAPI Application Pod</text>
          <text x="12" y="38" font-size="10" font-weight="600" fill="#1D4ED8">diabetes-api (1/1 Ready)</text>
          <text x="12" y="62" font-size="10" font-weight="500" fill="#334155">• Container Port: <tspan font-weight="700">8000</tspan></text>
          <text x="12" y="80" font-size="10" font-weight="500" fill="#334155">• CPU: <tspan font-weight="700">100m req / 500m lim</tspan></text>
          <text x="12" y="98" font-size="10" font-weight="500" fill="#334155">• Mem: <tspan font-weight="700">256Mi req / 512Mi lim</tspan></text>
          <text x="12" y="116" font-size="10" font-weight="500" fill="#334155">• User: <tspan font-weight="700">appuser (Non-root)</tspan></text>
          <text x="12" y="134" font-size="10" font-weight="500" fill="#16A34A">• Health: <tspan font-weight="700">GET / (Live &amp; Ready)</tspan></text>
          <text x="12" y="170" font-size="9" font-weight="600" fill="#2563EB">Random Forest Inference API</text>
        </g>

      </g>

    </g>

  </g>

  <!-- FLOW ARROWS AND CONNECTIONS -->

  <!-- 1. Developer -> GitHub Arrow (Blue) -->
  <path d="M 132 230 L 132 265" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="138" y="238" width="95" height="18" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="143" y="251" font-size="9" font-weight="700" fill="#1D4ED8">1 Commit &amp; Push</text>

  <!-- Developer -> IAM Operator Line (Purple Dashed) -->
  <path d="M 220 172 L 250 172" fill="none" stroke="#9333EA" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <rect x="180" y="150" width="82" height="18" rx="4" fill="#F3E8FF" stroke="#E9D5FF"/>
  <text x="185" y="163" font-size="9" font-weight="700" fill="#7E22CE">IAM Operator</text>

  <!-- 2. GitHub -> ECR Arrow (Blue) -->
  <path d="M 220 322 L 270 215" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="220" y="270" width="95" height="18" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="225" y="283" font-size="9" font-weight="700" fill="#1D4ED8">2 Image Push</text>

  <!-- 3. ECR -> EKS Pod Image Pull (Blue Dashed) - Clean top route -->
  <path d="M 490 180 L 880 180 L 880 235" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
  <rect x="525" y="171" width="105" height="18" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="530" y="184" font-size="9" font-weight="700" fill="#1D4ED8">3 Pull @ Digest</text>

  <!-- 4. Client / Visitor -> NLB Arrow (Green) - Clean curve around EBS -->
  <path d="M 220 512 C 320 512, 340 380, 520 185 L 535 185" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="260" y="470" width="110" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="266" y="484" font-size="10" font-weight="700" fill="#047857">HTTP Traffic :80</text>

  <!-- 5. NLB -> Service Arrow (Green) -->
  <path d="M 600 222 L 600 273" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="605" y="238" width="80" height="18" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="610" y="251" font-size="9" font-weight="700" fill="#047857">4 Forward :80</text>

  <!-- 6. Service -> Pod Arrow (Green) -->
  <path d="M 748 360 L 775 360" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="735" y="338" width="50" height="18" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="740" y="351" font-size="9" font-weight="700" fill="#047857">5 :8000</text>

  <!-- FOOTER & LEGEND -->
  <line x1="45" y1="600" x2="1055" y2="600" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Legend Bar -->
  <g transform="translate(45, 615)">
    <line x1="0" y1="12" x2="30" y2="12" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="38" y="16" font-size="11" font-weight="600" fill="#334155">Code &amp; Container Delivery</text>

    <line x1="220" y1="12" x2="250" y2="12" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="258" y="16" font-size="11" font-weight="600" fill="#334155">Application Traffic (HTTP)</text>

    <line x1="440" y1="12" x2="470" y2="12" stroke="#9333EA" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
    <text x="478" y="16" font-size="11" font-weight="600" fill="#334155">IAM &amp; Management Control</text>

    <text x="0" y="42" font-size="11" font-weight="600" fill="#64748B"><tspan font-weight="700" fill="#0F172A">BOUNDARIES:</tspan> Single worker node (t3.small) · IAM Least-Privilege Operator (diabetes-operator) · Immutable digest-pinned ECR image · AWS Network Load Balancer.</text>
  </g>

</svg>
